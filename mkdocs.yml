site_name: Shopee
site_url: https://joaopc10.github.io/Desafio1-TraineeEngNet-2025-Shopee/

theme:
  name: material
  language: pt
  font:
    text: Roboto
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.top
    - navigation.footer
    - toc.follow
    - search.suggest
    - search.highlight
    - content.tabs.link
    - content.code.annotation
    - content.code.copy
  palette:
    - scheme: default
      primary: orange
      accent: light orange
      toggle:
        icon: material/weather-night
        name: Modo escuro
    - scheme: slate
      primary: red
      accent: red
      toggle:
        icon: material/weather-sunny
        name: Modo claro

markdown_extensions:
  - attr_list
  - tables
  - toc:
      permalink: true


nav:
  - Home: index.md
  - Atas: 
    - Ata 07/10/2025: Atas/ata07-10-2025_1.md
    - Ata 12/10/2025: Atas/ata12-10-2025_2.md
    - Ata 13/10/2025: Atas/ata13-10-2025_3.md
  - Planejamento: 
    - HeatMap: Planejamento/heatmap.md
    - Ferramentas: Planejamento/ferramentas.md
    - Cronograma a ser executado: Planejamento/cronograma_executado.md
  - Rich Picture: Rich-picture/richpicture.md
  - Elicitação: 
    - Requisitos Elicitados: Elicitacao/requisitos_elicitados.md
    - Técnicas de Priorização: 
      - Three Level Scale: Elicitacao/three_level_scale.md
      - MoSCoW: Elicitacao/moscow.md
  - Modelagem:
    - Metodologias Tradicionais:
      - Casos de Uso: Modelagem/casos_de_uso.md
      - Cenário: Modelagem/cenario.md
      - Especificação Suplementar: Modelagem/especificacao_suplementar.md
      - Léxico: Modelagem/lexico.md